<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Progress - Quiz System</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="../CSS/progress.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h3>Quiz System</h3>
            <ul>
                <li onclick="navigate('dashboard')">
                    <i class="fa-solid fa-house"></i> Dashboard
                </li>
                <li class="active" onclick="navigate('progress')">
                    <i class="fa-solid fa-chart-line"></i> My Progress
                </li>
                <li onclick="navigate('results')">
                    <i class="fa-solid fa-square-poll-vertical"></i> Results
                </li>
                <li onclick="navigate('leaderboard')">
                    <i class="fa-solid fa-trophy"></i> Leaderboard
                </li>
                <li onclick="navigate('profile')">
                    <i class="fa-solid fa-user"></i> Profile
                </li>
                <li onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </li>
            </ul>
        </div>

        <div class="main-content">
            <div class="header">
                <div>
                    <h1>My Progress</h1>
                    <p>Track your journey across every course</p>
                </div>
            </div>

            <div class="progress-list" id="progressList">
                <p>Loading progress...</p>
            </div>
        </div>

    </div>

    <script src="../JS/progress.js"></script>

</body>

</html>
