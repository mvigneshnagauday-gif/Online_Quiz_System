<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Quiz System</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="../CSS/results.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h3>Quiz System</h3>
            <ul>
                <li onclick="navigate('dashboard')">
                    <i class="fa-solid fa-house"></i> Dashboard
                </li>
                <li onclick="navigate('progress')">
                    <i class="fa-solid fa-chart-line"></i> My Progress
                </li>
                <li class="active" onclick="navigate('results')">
                    <i class="fa-solid fa-square-poll-vertical"></i> Results
                </li>
                <li onclick="navigate('leaderboard')">
                    <i class="fa-solid fa-trophy"></i> Leaderboard
                </li>
                <li onclick="navigate('profile')">
                    <i class="fa-solid fa-user"></i> Profile
                </li>
                <li onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </li>
            </ul>
        </div>

        <div class="main-content">
            <div class="header">
                <div>
                    <h1>Results</h1>
                    <p>Every attempt you've made, most recent first</p>
                </div>
            </div>

            <div class="results-table-wrapper">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Level</th>
                            <th>Score</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <tr>
                            <td colspan="5">Loading results...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="../JS/results.js"></script>

</body>

</html>
