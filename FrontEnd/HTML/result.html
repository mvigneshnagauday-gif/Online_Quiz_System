<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result - Quiz System</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="stylesheet" href="../CSS/result.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="result-container">

        <div class="result-card">

            <div class="result-icon" id="resultIcon">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h2 id="resultTitle">Level Passed!</h2>
            <p id="resultSubtitle">Java - Level 1</p>

            <div class="score-circle" id="scoreCircle">
                <span id="scorePercent">0%</span>
            </div>

            <div class="stats-row">
                <div class="stat-box">
                    <h4 id="correctCount">0</h4>
                    <p>Correct</p>
                </div>
                <div class="stat-box">
                    <h4 id="wrongCount">0</h4>
                    <p>Wrong</p>
                </div>
                <div class="stat-box">
                    <h4 id="totalCount">0</h4>
                    <p>Total</p>
                </div>
            </div>

            <p class="pass-note" id="passNote">You need 50% to pass this level.</p>

            <div class="result-actions">
                <button class="btn-secondary" onclick="reviewAnswers()">Review Answers</button>
                <button class="btn-primary" id="primaryActionBtn" onclick="handlePrimaryAction()">Continue</button>
            </div>

        </div>

    </div>

    <script src="../JS/result.js"></script>

</body>

</html>
